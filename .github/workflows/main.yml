name: RAUT Frontend — CI/CD

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: "20.x"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  deploy-production:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: [lint, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Clone if repo doesn't exist, otherwise pull
            if [ ! -d "/opt/raut_frontend/.git" ]; then
              git clone https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git /opt/raut_frontend
            else
              cd /opt/raut_frontend
              git remote set-url origin https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git
              git fetch origin
              git reset --hard origin/main
            fi

            cd /opt/raut_frontend

            # Production env must exist
            if [ ! -f .env.production ]; then
              echo "ERROR: .env.production does not exist!"
              echo "Please create it based on .env.production.example"
              exit 1
            fi

            # Deploy frontend with Docker
            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              up -d --build

            echo "Frontend deployment complete"

      - name: Deployment notification
        if: success()
        run: |
          echo "RAUT Frontend deployed to Production successfully"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"

      - name: Deployment failed
        if: failure()
        run: |
          echo "RAUT Frontend production deployment failed"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
