services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    image: raut-frontend:latest
    container_name: raut-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - raut-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    labels:
      - "com.raut.service=frontend"
      - "com.raut.environment=production"

networks:
  raut-network:
    external: true
