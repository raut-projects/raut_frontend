# This file is for reference only
# GitHub Actions creates docker-compose.yml on the server automatically
# The actual deployment uses: ghcr.io/raut-projects/raut_frontend/frontend:latest

services:
  frontend:
    image: ghcr.io/raut-projects/raut_frontend/frontend:latest
    container_name: raut-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    labels:
      - "com.raut.service=frontend"
      - "com.raut.environment=production"
